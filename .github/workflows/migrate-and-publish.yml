name: Validate and publish IICA examination

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: iica-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate complete application and bank
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\s+src="([^"]+)"/g)].map(x=>x[1]);
          const ctx={window:{}};vm.createContext(ctx);
          for(const p of scripts.filter(x=>x.startsWith('data/')))vm.runInContext(fs.readFileSync(p,'utf8'),ctx,{filename:p});
          const q=ctx.window.QUESTION_BANK,m=JSON.parse(fs.readFileSync('data/bank_manifest.json','utf8'));
          assert(Array.isArray(q)&&q.length>0);assert.equal(q.length,m.activeQuestionCount);
          assert.equal(new Set(q.map(x=>x.id)).size,q.length);
          for(const x of q){assert.equal(x.options.length,4);assert.equal(new Set(x.options).size,4);assert(Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4);}
          for(const p of scripts){assert(fs.existsSync(p),p);new vm.Script(fs.readFileSync(p,'utf8'),{filename:p});}
          new vm.Script(fs.readFileSync('sw.js','utf8'));
          assert(fs.readFileSync('sw.js','utf8').includes('key.startsWith(CACHE_PREFIX)'));
          assert(fs.readFileSync('app.js','utf8').includes('directorMock.history.v2'));
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));assert.equal(manifest.scope,'./');
          const source=JSON.parse(fs.readFileSync('migration/source-manifest.json','utf8'));
          for(const r of source.files)assert(fs.existsSync(r.destinationPath),'Missing migrated source: '+r.destinationPath);
          // The migration manifest is historical preservation evidence, not a freeze on future code edits.
          console.log(JSON.stringify({status:'PASS',activeQuestions:q.length,migratedFilesPresent:source.files.length,scriptFilesValidated:scripts.length}));
          JS
      - name: Assemble public site
        run: |
          mkdir -p "$RUNNER_TEMP/exam-site/migration"
          cp index.html app.js styles.css sw.js pwa-update.js manifest.json .nojekyll SOURCES.md QUESTION_BANK_LICENSE.md AUDIT_SUMMARY.md "$RUNNER_TEMP/exam-site/"
          cp -r data icons "$RUNNER_TEMP/exam-site/"
          cp migration/*.json "$RUNNER_TEMP/exam-site/migration/"
          printf '{"sourceCommit":"%s"}\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/exam-site/deployment.json"
      - name: Update publishing branch without rewriting history
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add -B gh-pages "$RUNNER_TEMP/exam-pages" origin/gh-pages
          # Retain existing inert workflow definitions; a build token must not modify workflow files.
          # Check content, not just size/mtime: checkout timestamps can match for different bytes.
          rsync -a --checksum --delete --exclude='.git' --exclude='.github' "$RUNNER_TEMP/exam-site/" "$RUNNER_TEMP/exam-pages/"
          cmp "$RUNNER_TEMP/exam-site/deployment.json" "$RUNNER_TEMP/exam-pages/deployment.json"
          git -C "$RUNNER_TEMP/exam-pages" add -A
          if ! git -C "$RUNNER_TEMP/exam-pages" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/exam-pages" commit -m "Publish IICA examination from $(git rev-parse --short HEAD)"
            git -C "$RUNNER_TEMP/exam-pages" push origin HEAD:gh-pages
          fi
      - name: Request Pages build for publishing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - uses: actions/upload-artifact@v4
        with:
          name: published-examination-site
          path: ${{ runner.temp }}/exam-site/
